          code: [-100, 7000, -1478, 722, -363, 713, -364, 713, -363, 714, -363, 123, -363, 714, -363, 361, -710, 368, -710, 720, -362, 653, -711, 721, -362, 362, -709, 368, -709, 368, -709, 719, -363, 361, -710, 367, -709, 719, -364, 360, -709, 720, -363, 714, -362, 361, -708, 720, -362, 713, -364, 361, -707, 532, -709, 368, -707, 367, -710, 368, -708, 719, -364, 360, -709, 721, -363, 361, -709, 719, -364, 362, -708, 720, -363, 361, -709, 719, -364, 362, -707, 720]
