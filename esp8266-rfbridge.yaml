esphome:
  name: rfbridge

esp8266:
  board: d1_mini


api:
  password: !secret api_password

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Rfbridge Fallback Hotspot"
    password: !secret fallback_ap_password

captive_portal:

remote_transmitter:
  pin: 
    number: GPIO13
    inverted: false
  carrier_duty_percent: 100%

remote_receiver:
  pin: 
    number: GPIO14
    inverted: false
  dump:
    - raw
  tolerance: 50%
  filter: 200us
  idle: 3ms
  buffer_size: 2kb

logger:

cover:
  - platform: time_based
    name: "Living Room Shutter"
    id: living_room_left_cover
    
    open_action:
      - remote_transmitter.transmit_raw:
          code: [-100, 7000, -1480, 723, -363, 715, -363, 714, -364, 714, -363, 715, -362, 716, -363, 442, -711, 765, -710, 722, -365, 360, -712, 721, -365, 361, -711, 367, -712, 542, -710, 723, -361, 363, -711, 370, -710, 720, -365, 361, -711, 722, -363, 715, -364, 361, -711, 722, -363, 716, -364, 361, -712, 368, -711, 369, -711, 368, -711, 368, -711, 722, -361, 363, -712, 721, -365, 361, -711, 368, -710, 368, -710, 720, -365, 361, -711, 368, -710, 369, -710, 722]
          repeat: 
            times: 6
            wait_time: 0s
    
    close_action:
      - remote_transmitter.transmit_raw:
          code: [-100, 7000, -1477, 720, -363, 713, -362, 713, -364, 713, -362, 713, -362, 713, -362, 360, -709, 367, -710, 719, -362, 362, -708, 721, -362, 362, -708, 366, -709, 123, -709, 719, -362, 359, -710, 367, -708, 876, -363, 361, -709, 718, -363, 714, -362, 362, -708, 719, -363, 714, -363, 361, -708, 243, -707, 367, -709, 368, -708, 366, -709, 720, -363, 361, -709, 719, -363, 360, -709, 367, -708, 721, -363, 713, -363, 362, -708, 368, -707, 720, -363, 714]
